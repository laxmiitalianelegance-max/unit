<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Unit</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#17130f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#17130f;--surface:#201a14;--surface-2:#29221a;--line:#3d3226;--line-soft:#2a2219;--gold:#c9a15f;--gold-dim:#8f7548;--ink:#f2ead9;--ink-dim:#a89880;--ink-faint:#6f6250;--sage:#8faa74;--brick:#c1554a}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,rgba(201,161,95,.06),transparent 60%),var(--bg);color:var(--ink);font-family:-apple-system,system-ui,sans-serif;padding-bottom:78px}h1{font-family:"Fraunces",Georgia,serif;font-weight:500}header{padding:26px 20px 18px}header:after{content:"";display:block;margin-top:16px;border-bottom:1px dashed var(--line)}.eyebrow{font-family:"Fraunces",Georgia,serif;font-style:italic;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin:0 0 6px}h1{font-size:26px;margin:0 0 4px}p.sub{color:var(--ink-dim);font-size:12.5px;margin:0}.page{display:none;padding:20px;max-width:560px;margin:0 auto}.page.active{display:block}label{display:block;font-family:"Fraunces",Georgia,serif;font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-faint);margin-top:16px;margin-bottom:7px}input,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:11px 12px;color:var(--ink);font-size:15px;font-family:inherit}input:focus,textarea:focus{outline:none;border-color:var(--gold-dim)}textarea{min-height:70px;resize:vertical}button.primary{width:100%;margin-top:22px;padding:14px;border:1px solid var(--gold);border-radius:3px;background:var(--gold);color:#1a1510;font-family:"Fraunces",Georgia,serif;font-size:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}button.primary:disabled,.sendbtn:disabled{opacity:.4}#pStatus{margin-top:14px;font-size:13px;white-space:pre-wrap;line-height:1.5}#pStatus.ok{color:var(--sage)}#pStatus.err{color:var(--brick)}#pStatus.loading{color:var(--ink-dim)}#pStatus a{color:var(--sage)}.keys{background:var(--surface);border:1px solid var(--line-soft);border-radius:3px;padding:12px 14px 14px;margin-bottom:14px}.keys label{margin-top:8px}.keys label:first-child{margin-top:0}.keys input{font-family:"SF Mono",Menlo,monospace;font-size:12.5px;background:var(--bg)}.toggle-keys{font-size:11px;color:var(--ink-faint);margin-top:10px;display:inline-block}.modes{display:flex;margin-bottom:16px;border:1px solid var(--line);border-radius:3px;overflow:hidden}.mode{flex:1;padding:10px 6px;font-size:11px;color:var(--ink-faint);text-align:center;border-right:1px solid var(--line);background:var(--surface)}.mode:last-child{border-right:none}.mode.active{color:var(--gold);background:var(--surface-2)}.promptbox{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:12px}.promptbox textarea{border:none;background:transparent;padding:4px;min-height:60px}.sendrow{display:flex;justify-content:flex-end;margin-top:8px;border-top:1px dashed var(--line-soft);padding-top:10px}.sendbtn{padding:9px 20px;border:1px solid var(--gold);border-radius:3px;background:transparent;color:var(--gold);font-family:"Fraunces",Georgia,serif;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}.panels{display:flex;flex-direction:column;gap:12px;margin-top:16px}.panel{border:1px solid var(--line-soft);border-radius:3px;background:var(--surface);overflow:hidden}.panel-head{padding:9px 13px;font-family:"Fraunces",Georgia,serif;font-size:11px;text-transform:uppercase;letter-spacing:.1em;border-bottom:1px dashed var(--line);display:flex;align-items:center;gap:8px}.dot{width:6px;height:6px;transform:rotate(45deg)}.panel-body{padding:13px;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word}.panel-body.err{color:var(--brick)}.panel-body.loading{color:var(--ink-dim);font-style:italic}nav.bottomnav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}nav.bottomnav .navitem{flex:1;text-align:center;padding:12px 4px 10px;font-family:"Fraunces",Georgia,serif;font-size:11px;color:var(--ink-faint);border-top:2px solid transparent}nav.bottomnav .navitem.active{color:var(--gold);border-top-color:var(--gold)}
</style>
</head>
<body>
<header><p class="eyebrow">Laxmi &middot; Italian Elegance</p><h1>Unit</h1><p class="sub">AI tim i unos proizvoda, na jednom mestu.</p></header>
<div class="page active" id="page-team"><div class="keys"><label>OpenAI API kljuc</label><input type="password" id="openaiKey" placeholder="sk-..."><label>xAI (Grok) API kljuc</label><input type="password" id="grokKey" placeholder="xai-..."><span class="toggle-keys" id="toggleKeys">prikazi kljuceve</span></div><div class="modes"><div class="mode active" data-mode="side">Jedan pored drugog</div><div class="mode" data-mode="combine">Spojeni odgovor</div><div class="mode" data-mode="critique">Unakrsna kritika</div></div><div class="promptbox"><textarea id="prompt" placeholder="Postavi pitanje svim modelima..."></textarea><div class="sendrow"><button class="sendbtn" id="sendBtn">Posalji</button></div></div><div class="panels" id="panels"></div></div>
<div class="page" id="page-product"><form id="f"><label>Naziv proizvoda</label><input type="text" name="title" required placeholder="npr. Korset haljina od brokata"><label>Cena (EUR)</label><input type="text" name="price" required inputmode="decimal" placeholder="npr. 290"><label>Velicine (odvojene zarezom)</label><input type="text" name="sizes" required placeholder="npr. 34,36,38,40,42,44"><label>Opis</label><textarea name="description" placeholder="Kratak opis (opciono)"></textarea><label>Video</label><input type="file" name="video" accept="video/*" required><button type="submit" class="primary" id="submitBtn">Dodaj proizvod</button></form><div id="pStatus"></div></div>
<nav class="bottomnav"><div class="navitem active" data-page="team">AI Tim</div><div class="navitem" data-page="product">Novi proizvod</div></nav>
<script>
window.onerror=function(msg,src,line,col){document.body.insertAdjacentHTML("afterbegin",'<div style="background:#3a0d0d;color:#fca5a5;padding:12px;font-size:12px;font-family:monospace;word-break:break-word;">GRESKA: '+msg+' (linija '+line+', kolona '+col+')</div>');return false};
if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js");
document.querySelectorAll(".navitem").forEach(el=>el.addEventListener("click",()=>{document.querySelectorAll(".navitem").forEach(n=>n.classList.remove("active"));document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));el.classList.add("active");document.getElementById("page-"+el.dataset.page).classList.add("active")}));
const openaiKeyEl=document.getElementById("openaiKey"),grokKeyEl=document.getElementById("grokKey");openaiKeyEl.value=localStorage.getItem("openaiKey")||"";grokKeyEl.value=localStorage.getItem("grokKey")||"";openaiKeyEl.addEventListener("input",()=>localStorage.setItem("openaiKey",openaiKeyEl.value));grokKeyEl.addEventListener("input",()=>localStorage.setItem("grokKey",grokKeyEl.value));document.getElementById("toggleKeys").addEventListener("click",e=>{const t=openaiKeyEl.type==="password"?"text":"password";openaiKeyEl.type=t;grokKeyEl.type=t;e.target.textContent=t==="text"?"sakrij kljuceve":"prikazi kljuceve"});
let mode="side";document.querySelectorAll(".mode").forEach(el=>el.addEventListener("click",()=>{document.querySelectorAll(".mode").forEach(m=>m.classList.remove("active"));el.classList.add("active");mode=el.dataset.mode}));
async function askClaude(prompt,system){const messages=system?[{role:"system",content:system},{role:"user",content:prompt}]:[{role:"user",content:prompt}];const res=await fetch("/api/ai-proxy",{method:"POST",headers:{"Content-Type":"application/json","x-provider":"claude"},body:JSON.stringify({messages})});const data=await res.json();if(!res.ok||data.error)throw new Error("Claude greska: "+JSON.stringify(data.error||res.status).slice(0,150));return data.choices?.[0]?.message?.content?.trim()||"(prazan odgovor)"}
async function askViaProxy(provider,model,prompt,apiKey,system){if(!apiKey)throw new Error("Nedostaje API kljuc za "+provider);const messages=system?[{role:"system",content:system},{role:"user",content:prompt}]:[{role:"user",content:prompt}];const res=await fetch("/api/ai-proxy",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":apiKey,"x-provider":provider},body:JSON.stringify({model,messages,max_tokens:1000})});if(!res.ok){const t=await res.text();throw new Error(provider+" greska: "+res.status+" - "+t.slice(0,150))}const data=await res.json();if(data.error)throw new Error(provider+" greska: "+JSON.stringify(data.error).slice(0,150));return data.choices?.[0]?.message?.content?.trim()||"(prazan odgovor)"}
const askGPT=(p,k,s)=>askViaProxy("openai","gpt-4o",p,k,s),askGrok=(p,k,s)=>askViaProxy("grok","grok-4",p,k,s);
async function askFree(prompt,system){const messages=system?[{role:"system",content:system},{role:"user",content:prompt}]:[{role:"user",content:prompt}];const res=await fetch("/api/free-ai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages})});const data=await res.json();if(!res.ok||data.error)throw new Error("Besplatni AI greska: "+JSON.stringify(data.error||res.status).slice(0,150));return data.choices?.[0]?.message?.content?.trim()||"(prazan odgovor)"}
function panelHtml(id,title,color){return '<div class="panel"><div class="panel-head" style="color:'+color+'"><span class="dot" style="background:'+color+'"></span>'+title+'</div><div class="panel-body loading" id="'+id+'">radi...</div></div>'}function setPanel(id,text,isErr){const el=document.getElementById(id);if(!el)return;el.className="panel-body"+(isErr?" err":"");el.textContent=text}
const sendBtn=document.getElementById("sendBtn"),promptEl=document.getElementById("prompt"),panelsEl=document.getElementById("panels");sendBtn.addEventListener("click",async()=>{const prompt=promptEl.value.trim();if(!prompt){panelsEl.innerHTML='<div class="panel"><div class="panel-body err">Prvo upisi pitanje u polje iznad.</div></div>';return}const openaiKey=openaiKeyEl.value.trim(),grokKey=grokKeyEl.value.trim();sendBtn.disabled=true;panelsEl.innerHTML=panelHtml("p-claude","Claude","#c9a15f")+panelHtml("p-gpt","ChatGPT","#8faa74")+panelHtml("p-grok","Grok","#b3566a")+panelHtml("p-free","Besplatni AI","#7c8bae");let claudeAnswer="",gptAnswer="",grokAnswer="",freeAnswer="";const claudeP=askClaude(prompt).then(t=>{claudeAnswer=t;setPanel("p-claude",t,false)}).catch(e=>setPanel("p-claude",e.message,true)),gptP=askGPT(prompt,openaiKey).then(t=>{gptAnswer=t;setPanel("p-gpt",t,false)}).catch(e=>setPanel("p-gpt",e.message,true)),grokP=askGrok(prompt,grokKey).then(t=>{grokAnswer=t;setPanel("p-grok",t,false)}).catch(e=>setPanel("p-grok",e.message,true)),freeP=askFree(prompt).then(t=>{freeAnswer=t;setPanel("p-free",t,false)}).catch(e=>setPanel("p-free",e.message,true));await Promise.all([claudeP,gptP,grokP,freeP]);const answers=[claudeAnswer&&("Odgovor A (Claude):\n"+claudeAnswer),gptAnswer&&("Odgovor B (ChatGPT):\n"+gptAnswer),grokAnswer&&("Odgovor C (Grok):\n"+grokAnswer),freeAnswer&&("Odgovor D (Besplatni AI):\n"+freeAnswer)].filter(Boolean);if(mode==="combine"&&answers.length>=2){panelsEl.insertAdjacentHTML("beforeend",panelHtml("p-combined","Spojeni odgovor","#a89880"));try{const merged=await askClaude('Pitanje korisnika bilo je: "'+prompt+'"\n\n'+answers.join("\n\n")+'\n\nNapisi jedan spojen, najbolji moguci finalni odgovor. Odgovori direktno, bez meta-komentara.');setPanel("p-combined",merged,false)}catch(e){setPanel("p-combined",e.message,true)}}if(mode==="critique"&&answers.length>=2){const others=mine=>answers.filter(a=>!a.startsWith(mine)).join("\n\n");if(claudeAnswer)askClaude('Pitanje: "'+prompt+'"\n\nOvo su odgovori drugih:\n'+others("Odgovor A")+'\n\nOceni ukratko.').then(t=>{panelsEl.insertAdjacentHTML("beforeend",panelHtml("p-crit-claude","Claude kritikuje ostale","#c9a15f"));setPanel("p-crit-claude",t,false)});if(gptAnswer)askGPT('Pitanje: "'+prompt+'"\n\nOvo su odgovori drugih:\n'+others("Odgovor B")+'\n\nOceni ukratko.',openaiKey).then(t=>{panelsEl.insertAdjacentHTML("beforeend",panelHtml("p-crit-gpt","ChatGPT kritikuje ostale","#8faa74"));setPanel("p-crit-gpt",t,false)});if(grokAnswer)askGrok('Pitanje: "'+prompt+'"\n\nOvo su odgovori drugih:\n'+others("Odgovor C")+'\n\nOceni ukratko.',grokKey).then(t=>{panelsEl.insertAdjacentHTML("beforeend",panelHtml("p-crit-grok","Grok kritikuje ostale","#b3566a"));setPanel("p-crit-grok",t,false)})}sendBtn.disabled=false});
const form=document.getElementById("f"),pStatus=document.getElementById("pStatus"),submitBtn=document.getElementById("submitBtn");form.addEventListener("submit",async e=>{e.preventDefault();submitBtn.disabled=true;pStatus.className="loading";pStatus.textContent="Otpremam video i kreiram proizvod... (moze potrajati, ne zatvaraj stranicu)";const formData=new FormData(form);try{const res=await fetch("/api/create-product",{method:"POST",body:formData}),data=await res.json();if(data.ok){pStatus.className="ok";pStatus.innerHTML="Gotovo! Proizvod je kreiran."+(data.adminUrl?'<br><a href="'+data.adminUrl+'" target="_blank">Otvori u Shopify adminu</a>':"");form.reset()}else{pStatus.className="err";pStatus.textContent="Greska: "+(data.error||"nepoznata greska")}}catch(err){pStatus.className="err";pStatus.textContent="Greska u vezi: "+err.message}finally{submitBtn.disabled=false}});
</script>
</body>
</html>
