<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Unit369</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#05070c">
<style>
:root{--bg:#05070c;--surface:#0b111a;--line:#233247;--ink:#f5f8fc;--muted:#95a3b8}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100dvh}.page{display:none}.page.active{display:block}button,input,textarea,select{font:inherit}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}#page-product form{display:grid;gap:10px}#page-product label{display:block;margin-top:6px;font-size:11px;color:var(--muted)}#page-product input,#page-product textarea,#page-product select{width:100%;background:#070c13;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px}#page-product textarea{min-height:100px;resize:vertical}#page-product .primary{margin-top:10px;padding:13px;border:0;border-radius:12px;background:#178ce8;color:white;font-weight:800}#pStatus{margin-top:12px;font-size:12px;white-space:pre-wrap}.section-title{font-size:24px;font-weight:800;margin:0 0 4px}.section-sub{font-size:13px;color:var(--muted);margin:0 0 16px}
</style>
</head>
<body class="u369-shell">
<header><h1>Unit369</h1></header>
<aside id="u369-sidebar" class="u369-sidebar">
  <div class="u369-side-top">
    <div class="u369-brand"><div class="u369-brand-mark">369</div><span>Unit369</span></div>
    <button type="button" class="u369-newchat" id="u369-shell-new">＋ <span data-i18n="newChat">New chat</span></button>
  </div>
  <div class="u369-side-section" data-i18n="workspace">Workspace</div>
  <div class="u369-side-nav">
    <button type="button" class="u369-side-item active" data-shell-page="team"><span>✦</span><span data-i18n="chat">Chat</span></button>
    <button type="button" class="u369-side-item" data-shell-page="product"><span>▦</span><span data-i18n="products">Products</span></button>
    <button type="button" class="u369-side-item" data-shell-page="settings"><span>⚙</span><span data-i18n="settings">Settings</span></button>
  </div>
  <div class="u369-side-section" data-i18n="aiMode">AI mode</div>
  <div class="u369-side-modes">
    <button type="button" class="u369-mode-btn" data-chat-mode="side"><span data-i18n="sideBySide">Side by side</span></button>
    <button type="button" class="u369-mode-btn active" data-chat-mode="combine"><span data-i18n="combinedAnswer">Combined answer</span></button>
    <button type="button" class="u369-mode-btn" data-chat-mode="critique"><span data-i18n="crossCritique">Cross-critique</span></button>
  </div>
  <div class="u369-side-section" data-i18n="providers">Providers</div>
  <div id="u369-side-providers" class="u369-side-providers"></div>
  <div class="u369-side-section" data-i18n="chatHistory">Chat history</div>
  <div id="u369-side-history" class="u369-side-history"></div>
  <div class="u369-side-spacer"></div>
</aside>
<div id="u369-topbar" class="u369-topbar">
  <button type="button" id="u369-menu" class="u369-menu" data-i18n-aria="openMenu" aria-label="Open menu">☰</button>
  <div id="u369-work-title" class="u369-work-title" data-i18n="chat">Chat</div>
  <div class="u369-work-sub">Unit369</div>
</div>
<div id="u369-drawer-shade" class="u369-drawer-shade"></div>
<main>
  <section class="page active" id="page-team">
    <div class="u369-conversation-wrap"><div id="u369-conversation" class="u369-conversation"></div></div>
    <div id="u369-chat-composer" class="u369-chat-composer">
      <textarea id="u369-chat-input" class="u369-chat-input" rows="1" data-i18n-placeholder="messageUnit369" data-i18n-aria="messageUnit369" aria-label="Message Unit369" placeholder="Message Unit369"></textarea>
      <button type="button" id="u369-chat-send" class="u369-chat-send" data-i18n-aria="send" aria-label="Send">↑</button>
    </div>
    <div id="u369-chat-status" class="u369-chat-status" aria-live="polite"></div>
  </section>
  <section class="page" id="page-product">
    <div class="section-title" data-i18n="products">Products</div>
    <div class="section-sub" data-i18n="productIntro">Create and review products before saving.</div>
    <form id="f" novalidate>
      <label data-i18n="name">Name</label><input type="text" name="title" required>
      <label data-i18n="price">Price</label><input type="text" name="price" inputmode="decimal" required>
      <label data-i18n="sizes">Sizes</label><input type="text" name="sizes" required>
      <label data-i18n="description">Description</label><textarea name="description"></textarea>
      <label data-i18n="status">Status</label><select name="status"><option value="DRAFT" data-i18n="draft">Draft</option><option value="ACTIVE" data-i18n="active">Active</option></select>
      <label data-i18n="sku">SKU</label><input type="text" name="sku">
      <label data-i18n="type">Type</label><input type="text" name="productType">
      <label data-i18n="vendor">Vendor</label><input type="text" name="vendor">
      <label data-i18n="tags">Tags</label><input type="text" name="tags">
      <label data-i18n="images">Images</label><input type="file" name="images" accept="image/*" multiple>
      <label data-i18n="video">Video</label><input type="file" name="video" accept="video/*">
      <button type="submit" class="primary" data-i18n="reviewProduct">Review product</button>
    </form>
    <div id="pStatus" aria-live="polite"></div>
  </section>
  <section class="page" id="page-settings">
    <div class="section-title" data-i18n="settings">Settings</div>
    <div class="section-sub" data-i18n="settingsIntro">Application, language and integration settings.</div>
  </section>
</main>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{})}</script>
</body>
</html>
