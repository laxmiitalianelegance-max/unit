name = "unit"
main = "src/unit369.js"
compatibility_date = "2026-08-19"
keep_vars = true

[ai]
binding = "AI"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "TOOL_STORE"
class_name = "ToolStore"

[[durable_objects.bindings]]
name = "NATIVE_STORE"
class_name = "NativeStore"

[[migrations]]
tag = "orchestrator-v2"
new_sqlite_classes = ["ToolStore"]

[[migrations]]
tag = "native-core-v1"
new_sqlite_classes = ["NativeStore"]