name: Validate Unit369 stress hardening
on:
  push:
    branches: [staging-stress-hardening]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Build
        run: |
          set -e
          node --check src/native-execution.js
          node --check src/final-native-bridge.js
          node --check src/unit369.js
          npx --yes wrangler@4 deploy --dry-run --outdir .wrangler-dist
      - name: Stress native data and browser recovery
        run: |
          set -e
          sed 's/compatibility_date = "2026-08-19"/compatibility_date = "2026-05-03"/' wrangler.toml > wrangler.smoke.toml
          npx --yes wrangler@4 dev --config wrangler.smoke.toml --local --ip 127.0.0.1 --port 8787 --var APP_SECRET:test-app-secret-369 --var ENCRYPTION_KEY:0123456789abcdef0123456789abcdef >/tmp/wrangler.log 2>&1 &
          WPID=$!; trap 'kill $WPID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ >/dev/null && break; sleep 1; done
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
          node <<'JS'
          const crypto=require('crypto'),base='http://127.0.0.1:8787';
          function b64(s){return Buffer.from(s).toString('base64url')}
          function cookie(uid){const p=b64(JSON.stringify({uid,email:uid+'@test.local',name:uid,exp:Date.now()+3600000}));return `u369_account=${p}.${crypto.createHmac('sha256','test-app-secret-369').update(p).digest('base64url')}`}
          async function req(uid,path,opt={}){const r=await fetch(base+path,{...opt,headers:{'content-type':'application/json',cookie:cookie(uid),...(opt.headers||{})}}),t=await r.text();let d;try{d=JSON.parse(t)}catch{d=t}return{r,d}}
          (async()=>{
            const weird='Stress 🚀 <tag> & "quotes" — čćžšđ العربية 日本語';
            let x=await req('stress','/api/native/execute',{method:'POST',body:JSON.stringify({message:'Napravi dokument '+weird})});if(!x.r.ok||x.d.status==='failed')throw Error('special-char execution failed '+JSON.stringify(x.d));
            const docs1=(await req('stress','/api/native/documents')).d.documents||[];if(!docs1.some(d=>JSON.stringify(d).includes('Stress')))throw Error('special-char document missing');
            const long='Napravi dokument '+('abc 🚀 '.repeat(2500));x=await req('stress','/api/native/execute',{method:'POST',body:JSON.stringify({message:long})});if(x.r.status>=500)throw Error('long prompt crashed execution');
            x=await req('stress','/api/native/execute',{method:'POST',body:JSON.stringify({message:'Pretraži knowledge za nešto što ne postoji'})});if(!x.r.ok||!['partial','completed'].includes(x.d.status))throw Error('partial execution unstable '+JSON.stringify(x.d));
            x=await req('stress','/api/native/execute',{method:'POST',body:JSON.stringify({message:'Napravi dokument recovery-posle-partial'})});if(!x.r.ok||x.d.status==='failed')throw Error('recovery after partial failed');
            const jobs=[];for(let i=0;i<40;i++)jobs.push(req('bulk','/api/native/documents',{method:'POST',body:JSON.stringify({title:'Bulk '+i,content:'row '+i})}));const made=await Promise.all(jobs);if(made.some(v=>!v.r.ok))throw Error('bulk document create failure');const bulk=(await req('bulk','/api/native/documents')).d.documents||[];if(bulk.length<40)throw Error('bulk documents lost '+bulk.length);
            const browser=await require('playwright').chromium.launch({headless:true});
            const ctx=await browser.newContext({viewport:{width:390,height:844},serviceWorkers:'allow'});const p=await ctx.newPage();p.setDefaultTimeout(8000);const errors=[];p.on('pageerror',e=>errors.push(String(e.message||e)));
            await ctx.addCookies([{name:'u369_account',value:cookie('ui').split('=')[1],domain:'127.0.0.1',path:'/'}]);
            let aiCalls=0;p.route('**/api/free-ai',async r=>{aiCalls++;await new Promise(z=>setTimeout(z,350));await r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({content:'OK '+aiCalls})})});
            await p.goto(base+'/',{waitUntil:'domcontentloaded'});await p.waitForTimeout(500);
            await p.locator('#u369-chat-input').fill('Samo odgovori: test duplog klika 🚀');
            await Promise.all([p.locator('#u369-chat-send').click(),p.locator('#u369-chat-send').click({force:true}),p.locator('#u369-chat-send').click({force:true})]);
            await p.waitForTimeout(1200);const userTurns=await p.locator('.u369-user-msg').count();if(userTurns!==1)throw Error('duplicate chat turns '+userTurns);if(aiCalls!==1)throw Error('duplicate AI calls '+aiCalls);if(await p.locator('#u369-chat-send').isDisabled())throw Error('send stuck after rapid clicks');
            p.unroute('**/api/free-ai');p.route('**/api/free-ai',async r=>{await new Promise(z=>setTimeout(z,2500));await r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({content:'late'})})});
            await p.locator('#u369-chat-input').fill('Test reload tokom odgovora');await p.locator('#u369-chat-send').click();await p.waitForTimeout(120);await p.reload({waitUntil:'domcontentloaded'});await p.waitForTimeout(500);if(await p.locator('#u369-chat-send').isDisabled())throw Error('send disabled after reload recovery');
            if(errors.length)throw Error('page errors '+errors.join(' | '));await browser.close();
            const isolated=(await req('other','/api/native/documents')).d.documents||[];if(isolated.length)throw Error('cross-user stress leak');
            console.log('Unit369 stress hardening passed');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS