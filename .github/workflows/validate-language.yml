name: Validate Unit369 language behavior
on:
  push:
    branches: [staging-deep-audit]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Syntax and build
        run: |
          set -e
          node --check src/i18n-coordinator-safe.js
          node --check src/conversation-safe.js
          npx --yes wrangler@4 deploy --dry-run --outdir .wrangler-dist
      - name: Browser language ownership test
        run: |
          set -e
          sed 's/compatibility_date = "2026-08-19"/compatibility_date = "2026-05-03"/' wrangler.toml > wrangler.smoke.toml
          npx --yes wrangler@4 dev --config wrangler.smoke.toml --local --ip 127.0.0.1 --port 8787 >/tmp/wrangler.log 2>&1 &
          WPID=$!; trap 'kill $WPID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ >/tmp/root.html && break; sleep 1; done
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess
          h=Path('/tmp/root.html').read_text(errors='replace')
          for i,s in enumerate(re.findall(r'<script\b[^>]*>([\s\S]*?)</script>',h,re.I)):
            if s.strip():
              p=Path(f'/tmp/inline-{i}.js');p.write_text(s);subprocess.run(['node','--check',str(p)],check=True)
          PY
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true}),p=await b.newPage({viewport:{width:390,height:844}});p.setDefaultTimeout(7000);const errors=[];let seen='';p.on('pageerror',e=>errors.push(String(e.message||e)));await p.addInitScript(()=>localStorage.setItem('u369-lang-all-v4','sr'));await p.route('**/api/status',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({version:'test',integrations:{claude:false,openai:false,grok:false,workersAi:true,shopify:false}})}));await p.route('**/api/ui-i18n',async r=>{const body=JSON.parse(r.request().postData()||'{}'),t=String(body.target||'en').toLowerCase();let d={};if(t.startsWith('sr'))d={chat:'Ćaskanje',products:'Proizvodi',settings:'Podešavanja',newChat:'Novi razgovor',workspace:'Radni prostor',aiMode:'AI režim',providers:'Provajderi',chatHistory:'Istorija razgovora',sideBySide:'Jedan pored drugog',combinedAnswer:'Spojeni odgovor',crossCritique:'Unakrsna kritika',messageUnit369:'Poruka za Unit369',copy:'Kopiraj',thinking:'Razmišljam…',integrations:'Integracije',refresh:'Osveži',connected:'Povezano',notConnected:'Nije povezano',application:'Aplikacija',applicationLanguage:'Jezik aplikacije',openMenu:'Otvori meni'};else if(t.startsWith('fr'))d={chat:'Discussion',products:'Produits',settings:'Paramètres',newChat:'Nouvelle discussion',workspace:'Espace de travail',aiMode:'Mode IA',providers:'Fournisseurs',chatHistory:'Historique',messageUnit369:'Message à Unit369',applicationLanguage:'Langue de l’application',openMenu:'Ouvrir le menu'};else if(t.startsWith('ar'))d={chat:'الدردشة',products:'المنتجات',settings:'الإعدادات',newChat:'محادثة جديدة',workspace:'مساحة العمل',aiMode:'وضع الذكاء الاصطناعي',providers:'المزوّدون',chatHistory:'سجل المحادثات',messageUnit369:'رسالة إلى Unit369',applicationLanguage:'لغة التطبيق',openMenu:'فتح القائمة'};await r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({d})})});await p.route('**/api/free-ai',async r=>{const body=JSON.parse(r.request().postData()||'{}');seen=body.messages?.[0]?.content||'';await r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({content:'Ćao! Dobro sam.'})})});await p.goto('http://127.0.0.1:8787/',{waitUntil:'domcontentloaded'});await p.waitForTimeout(1000);if((await p.locator('#u369-work-title').textContent())!=='Ćaskanje')throw Error('Serbian topbar missing');if((await p.locator('#u369-chat-input').getAttribute('placeholder'))!=='Poruka za Unit369')throw Error('Serbian composer missing');await p.locator('#u369-chat-input').fill('Kako si?');await p.locator('#u369-chat-send').click();await p.locator('.u369-answer').filter({hasText:'Ćao! Dobro sam.'}).waitFor();if(!/natural standard Serbian/i.test(seen)||!/Ekavian/i.test(seen)||!/Bok/.test(seen))throw Error('Serbian AI instruction missing');await p.locator('#u369-menu').click();await p.locator('[data-shell-page="settings"]').click();await p.locator('#u369-lang-all-s').selectOption('fr');await p.waitForFunction(()=>document.documentElement.lang.toLowerCase().startsWith('fr'));await p.waitForTimeout(250);if((await p.locator('#page-settings .section-title').textContent())!=='Paramètres')throw Error('French settings not applied');if((await p.locator('html').getAttribute('dir'))!=='ltr')throw Error('French direction wrong');await p.locator('#u369-lang-all-s').selectOption('ar');await p.waitForFunction(()=>document.documentElement.lang.toLowerCase().startsWith('ar'));await p.waitForTimeout(250);if((await p.locator('html').getAttribute('dir'))!=='rtl')throw Error('Arabic RTL not applied');if(errors.length)throw Error('page errors: '+errors.join(' | '));await b.close();console.log('language ownership passed')})().catch(e=>{console.error(e);process.exit(1)});
          JS