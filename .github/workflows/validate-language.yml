name: Validate Unit369 language behavior
on:
  push:
    branches: [staging-serbian-language]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Syntax and build
        run: |
          set -e
          node --check src/chat-language-safe.js
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess
          x=Path('src/chat-language-safe.js').read_text();m=re.search(r'const\s+CLIENT\s*=\s*String\.raw`([\s\S]*?)`;',x)
          if not m: raise SystemExit('CLIENT missing')
          p=Path('/tmp/chat-language-client.js');p.write_text(m.group(1));subprocess.run(['node','--check',str(p)],check=True)
          PY
          npx --yes wrangler@4 deploy --dry-run --outdir .wrangler-dist
      - name: Browser language injection test
        run: |
          set -e
          sed 's/compatibility_date = "2026-08-19"/compatibility_date = "2026-05-03"/' wrangler.toml > wrangler.smoke.toml
          npx --yes wrangler@4 dev --config wrangler.smoke.toml --local --ip 127.0.0.1 --port 8787 >/tmp/wrangler.log 2>&1 &
          WPID=$!; trap 'kill $WPID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ -o /tmp/root.html && break; sleep 1; done
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true}),p=await b.newPage({viewport:{width:390,height:844}});let seen='';await p.addInitScript(()=>localStorage.setItem('u369-lang-all-v4','sr'));await p.route('**/api/free-ai',async route=>{const req=route.request();const body=JSON.parse(req.postData()||'{}');seen=body.messages&&body.messages[0]&&body.messages[0].content||'';await route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({content:'Ćao! Dobro sam, hvala. Kako si ti?'})})});await p.goto('http://127.0.0.1:8787/',{waitUntil:'domcontentloaded'});await p.waitForTimeout(900);await p.locator('#u369-chat-input').fill('Kako si?');await p.locator('#u369-chat-send').click();await p.locator('.u369-answer').filter({hasText:'Ćao! Dobro sam'}).waitFor();if(!/standard Serbian/i.test(seen)||!/Ekavian/i.test(seen)||!/Bok/.test(seen))throw Error('Serbian system instruction missing');await b.close();console.log('Serbian language behavior passed')})().catch(e=>{console.error(e);process.exit(1)});
          JS