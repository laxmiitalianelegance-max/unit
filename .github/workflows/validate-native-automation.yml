name: Validate Unit369 native automation
on:
  push:
    branches: [staging-native-automation]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Syntax and build
        run: |
          set -e
          node --check src/native-automation.js
          node --check src/native-capabilities.js
          node --check src/unit369.js
          npx --yes wrangler@4 deploy --dry-run --outdir .wrangler-dist
      - name: Workflow execution approval history and isolation
        run: |
          set -e
          sed 's/compatibility_date = "2026-08-19"/compatibility_date = "2026-05-03"/' wrangler.toml > wrangler.smoke.toml
          npx --yes wrangler@4 dev --config wrangler.smoke.toml --local --ip 127.0.0.1 --port 8787 --var APP_SECRET:test-app-secret-369 --var ENCRYPTION_KEY:0123456789abcdef0123456789abcdef >/tmp/wrangler.log 2>&1 &
          WPID=$!; trap 'kill $WPID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ >/dev/null && break; sleep 1; done
          node <<'JS'
          const crypto=require('crypto');
          const base='http://127.0.0.1:8787';
          function b64(s){return Buffer.from(s).toString('base64url')}
          function cookie(uid){const payload=b64(JSON.stringify({uid,email:uid+'@test.local',name:uid,exp:Date.now()+3600000}));const sig=crypto.createHmac('sha256','test-app-secret-369').update(payload).digest('base64url');return `u369_account=${payload}.${sig}`}
          async function req(uid,path,opt={}){const r=await fetch(base+path,{...opt,headers:{'content-type':'application/json','cookie':cookie(uid),...(opt.headers||{})}});const t=await r.text();let d;try{d=JSON.parse(t)}catch{d=t}if(!r.ok)throw Error(path+' '+r.status+' '+JSON.stringify(d));return d}
          (async()=>{
            let anon=await fetch(base+'/api/native/automations');if(anon.status!==401)throw Error('anonymous automation access must be 401');
            const plan=await req('userA','/api/native/plan',{method:'POST',body:JSON.stringify({message:'Napravi workflow sa triggerom, uslovom i odobrenjem'})});if(plan.external_required!==false||!plan.steps.some(s=>s.capability==='automate'))throw Error('native automation planning missing');
            const c=await req('userA','/api/native/automations',{method:'POST',body:JSON.stringify({name:'Lead workflow',description:'Native automation',trigger:{type:'manual'},conditions:[{path:'tier',op:'eq',value:'pro'}],actions:[{type:'set',key:'accepted',value:true},{type:'template',key:'message',template:'Hello {{input.name}}'},{type:'log',message:'Processed {{input.name}}'}],schedule:{type:'cron',expression:'0 9 * * *'}})});if(!c.workflow?.id)throw Error('workflow create failed');
            const wid=c.workflow.id;if(c.workflow.schedule.expression!=='0 9 * * *')throw Error('schedule metadata missing');
            const skip=await req('userA',`/api/native/automations/${wid}/run`,{method:'POST',body:JSON.stringify({input:{tier:'free',name:'Ana'}})});if(skip.execution.status!=='skipped')throw Error('condition skip failed');
            const run=await req('userA',`/api/native/automations/${wid}/run`,{method:'POST',body:JSON.stringify({input:{tier:'pro',name:'Ana'}})});if(run.execution.status!=='completed'||run.execution.output.accepted!==true||run.execution.output.message!=='Hello Ana')throw Error('safe execution failed');
            const upd=await req('userA',`/api/native/automations/${wid}`,{method:'PUT',body:JSON.stringify({actions:[{type:'log',message:'External write',external:true}]})});if(!upd.workflow?.id)throw Error('workflow update failed');
            const pending=await req('userA',`/api/native/automations/${wid}/run`,{method:'POST',body:JSON.stringify({input:{tier:'pro'}})});if(pending.execution.status!=='pending_approval'||!pending.execution.id)throw Error('approval gate failed');
            const eid=pending.execution.id;
            const approved=await req('userA',`/api/native/automations/${wid}/executions/${eid}/approve`,{method:'POST',body:'{}'});if(approved.execution.status!=='completed'||!approved.execution.approved_at)throw Error('approval execution failed');
            const hist=await req('userA',`/api/native/automations/${wid}/executions`);if(hist.executions.length<3)throw Error('execution history missing');
            const b=await req('userB','/api/native/automations');if(b.workflows.length!==0)throw Error('cross-user workflow leak');
            const foreign=await fetch(base+`/api/native/automations/${wid}`,{headers:{cookie:cookie('userB')}});if(foreign.status!==404)throw Error('userB can address userA workflow');
            await req('userA',`/api/native/automations/${wid}`,{method:'DELETE'});
            const after=await req('userA','/api/native/automations');if(after.workflows.length!==0)throw Error('workflow delete failed');
            console.log('Unit369 native Automation passed');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS