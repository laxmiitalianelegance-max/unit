name: Validate Unit369 native build
on:
  push:
    branches: [staging-native-build]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Syntax and build
        run: |
          set -e
          node --check src/native-build.js
          node --check src/native-capabilities.js
          node --check src/native-work.js
          node --check src/native-store.js
          node --check src/unit369.js
          npx --yes wrangler@4 deploy --dry-run --outdir .wrangler-dist
      - name: Build workspace CRUD snapshots diffs and isolation
        run: |
          set -e
          sed 's/compatibility_date = "2026-08-19"/compatibility_date = "2026-05-03"/' wrangler.toml > wrangler.smoke.toml
          npx --yes wrangler@4 dev --config wrangler.smoke.toml --local --ip 127.0.0.1 --port 8787 --var APP_SECRET:test-app-secret-369 --var ENCRYPTION_KEY:0123456789abcdef0123456789abcdef >/tmp/wrangler.log 2>&1 &
          WPID=$!; trap 'kill $WPID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ >/dev/null && break; sleep 1; done
          node <<'JS'
          const crypto=require('crypto');const base='http://127.0.0.1:8787';
          function b64(s){return Buffer.from(s).toString('base64url')}
          function cookie(uid){const payload=b64(JSON.stringify({uid,email:uid+'@test.local',name:uid,exp:Date.now()+3600000}));const sig=crypto.createHmac('sha256','test-app-secret-369').update(payload).digest('base64url');return `u369_account=${payload}.${sig}`}
          async function req(uid,path,opt={}){const r=await fetch(base+path,{...opt,headers:{'content-type':'application/json','cookie':cookie(uid),...(opt.headers||{})}});const t=await r.text();let d;try{d=JSON.parse(t)}catch{d=t}if(!r.ok)throw Error(path+' '+r.status+' '+JSON.stringify(d));return d}
          (async()=>{
            let anon=await fetch(base+'/api/native/build');if(anon.status!==401)throw Error('anonymous build access must be 401');
            const plan=await req('userA','/api/native/plan',{method:'POST',body:JSON.stringify({message:'Napravi aplikaciju i source code'})});if(!plan.steps.some(s=>s.capability==='build')||plan.external_required!==false)throw Error('native build planning missing');
            const w=await req('userA','/api/native/build',{method:'POST',body:JSON.stringify({name:'Unit369 App',language:'javascript'})});if(!w.workspace?.id)throw Error('workspace create failed');const wid=w.workspace.id;
            const f=await req('userA',`/api/native/build/${wid}/files`,{method:'POST',body:JSON.stringify({path:'src/index.js',content:'export const x = 1;'})});if(!f.file?.id)throw Error('source file create failed');const fid=f.file.id;
            const tree=await req('userA',`/api/native/build/${wid}/tree`);if(tree.tree.length!==1||tree.tree[0].path!=='src/index.js')throw Error('source tree failed');
            const snap=await req('userA',`/api/native/build/${wid}/snapshots`,{method:'POST',body:JSON.stringify({name:'v1',message:'initial'})});if(!snap.snapshot?.id)throw Error('snapshot failed');
            await req('userA',`/api/native/build/${wid}/files/${fid}`,{method:'PUT',body:JSON.stringify({content:'export const x = 2;'})});
            const diff=await req('userA',`/api/native/build/${wid}/diff?snapshot=${snap.snapshot.id}`);if(diff.files.length!==1||diff.files[0].status!=='modified')throw Error('diff failed');
            const tp=await req('userA',`/api/native/build/${wid}/test-plan`,{method:'POST',body:JSON.stringify({command:'npm test'})});if(tp.execution_available!==false||tp.mode!=='plan-only')throw Error('test plan contract failed');
            const b=await req('userB','/api/native/build');if(b.workspaces.length!==0)throw Error('cross-user build leak');
            const foreign=await fetch(base+`/api/native/build/${wid}`,{headers:{cookie:cookie('userB')}});if(foreign.status!==404)throw Error('userB can address userA workspace');
            await req('userA',`/api/native/build/${wid}`,{method:'DELETE'});const after=await req('userA','/api/native/build');if(after.workspaces.length!==0)throw Error('workspace delete failed');
            console.log('Unit369 native Build workspace passed');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS