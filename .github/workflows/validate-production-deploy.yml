name: Validate Unit369 production deployment
on:
  push:
    branches: [staging-production-deploy]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Validate deployment workflow contract
        run: |
          set -euo pipefail
          test -f .github/workflows/deploy-production.yml
          grep -q 'workflow_dispatch:' .github/workflows/deploy-production.yml
          grep -q "branches: \[main\]" .github/workflows/deploy-production.yml
          grep -q "'.github/release/production-now'" .github/workflows/deploy-production.yml
          grep -q "github.event_name == 'workflow_dispatch'" .github/workflows/deploy-production.yml
          grep -q "github.event_name == 'push'" .github/workflows/deploy-production.yml
          grep -q 'environment: production' .github/workflows/deploy-production.yml
          grep -q 'contents: write' .github/workflows/deploy-production.yml
          grep -q 'CLOUDFLARE_API_TOKEN' .github/workflows/deploy-production.yml
          ! grep -q 'CLOUDFLARE_ACCOUNT_ID' .github/workflows/deploy-production.yml
          ! grep -q 'api.cloudflare.com/client/v4/accounts' .github/workflows/deploy-production.yml
          ! grep -q 'wrangler@4 whoami' .github/workflows/deploy-production.yml
          grep -q 'https://unit.laxmiitalianelegance.workers.dev' .github/workflows/deploy-production.yml
          grep -q '/api/health/release' .github/workflows/deploy-production.yml
          grep -q '/api/auth/google/start' .github/workflows/deploy-production.yml
          grep -q 'Publish deployment receipt' .github/workflows/deploy-production.yml
          grep -q 'deployment-receipts' .github/workflows/deploy-production.yml
          grep -q '/tmp/deploy-stage' .github/workflows/deploy-production.yml
          grep -q 'dry_run' .github/workflows/deploy-production.yml
          grep -q 'deploy_start' .github/workflows/deploy-production.yml
          grep -q 'health_verified' .github/workflows/deploy-production.yml
          grep -q 'oauth_verified' .github/workflows/deploy-production.yml
          grep -q "npx --yes wrangler@4 deploy --dry-run" .github/workflows/deploy-production.yml
          grep -q "npx --yes wrangler@4 deploy" .github/workflows/deploy-production.yml
          npx --yes wrangler@4 deploy --dry-run --outdir .wrangler-deploy-contract
          echo 'Unit369 token-only production deployment contract passed'
