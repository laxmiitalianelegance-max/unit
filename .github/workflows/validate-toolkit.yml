name: Validate Unit369 toolkit integration
on:
  push:
    branches: [staging-toolkit, staging-external-connections-cleanup]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Static validation
        run: |
          set -e
          node --check src/unit369.js
          node --check src/final-native-bridge.js
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess
          h=Path('src/app.html').read_text()
          b=Path('src/final-native-bridge.js').read_text()
          assert '/app-icon-192.jpg' in h
          assert '--blue:#28a7ff' in h and '--bg:#05070c' in h
          assert 'openaiKey' not in h and 'grokKey' not in h and 'sendBtn' not in h
          assert '[data-page="tools"],#page-tools{display:none!important}' in b
          assert "dataset.u369ExternalConnections='optional'" in b
          for i,s in enumerate(re.findall(r'<script\b[^>]*>([\s\S]*?)</script>',h,re.I)):
            if s.strip():
              p=Path(f'/tmp/in-{i}.js');p.write_text(s);subprocess.run(['node','--check',str(p)],check=True)
          print('external connections isolation static contract passed')
          PY
          npx --yes wrangler@4 deploy --dry-run --outdir .wrangler-dist
      - name: Mobile browser regression test
        run: |
          set -e
          sed 's/compatibility_date = "2026-08-19"/compatibility_date = "2026-05-03"/' wrangler.toml > wrangler.smoke.toml
          npx --yes wrangler@4 dev --config wrangler.smoke.toml --local --ip 127.0.0.1 --port 8787 >/tmp/wrangler.log 2>&1 &
          WPID=$!; trap 'kill $WPID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ -o /tmp/root.html && break; sleep 1; done
          test -s /tmp/root.html
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true}),p=await b.newPage({viewport:{width:390,height:844}});p.setDefaultTimeout(7000);const errors=[];let aiCalls=0;p.on('pageerror',e=>errors.push(String(e.message||e)));
            await p.addInitScript(()=>localStorage.setItem('u369-lang-all-v4','sr'));
            await p.route('**/api/status',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({version:'test',integrations:{workersAi:true}})}));
            await p.route('**/api/free-ai',r=>{aiCalls++;return r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({content:'Ćao, radi.'})})});
            await p.route('**/api/ui-i18n',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({d:{chat:'Ćaskanje',products:'Proizvodi',settings:'Podešavanja',newChat:'Novi razgovor',workspace:'Radni prostor',chatHistory:'Istorija razgovora',messageUnit369:'Poruka za Unit369'}})}));
            await p.goto('http://127.0.0.1:8787/',{waitUntil:'domcontentloaded'});await p.waitForTimeout(800);
            if(!(await p.locator('.u369-brand img').getAttribute('src')).includes('/app-icon-192.jpg'))throw Error('logo missing');
            if(await p.locator('#u369-chat-input').count()!==1)throw Error('chat composer duplicate');
            if(await p.locator('[data-page="tools"]').isVisible())throw Error('Toolkit still visible in Core navigation');
            if(await p.locator('#page-tools').isVisible())throw Error('Toolkit page still visible in Core');
            const marker=await p.locator('html').getAttribute('data-u369-external-connections');if(marker!=='optional')throw Error('external connections not marked optional');
            await p.locator('#u369-chat-input').fill('Test');await p.locator('#u369-chat-send').click();await p.locator('.u369-answer').filter({hasText:'Ćao, radi.'}).waitFor();if(aiCalls!==1)throw Error('AI request duplicated: '+aiCalls);
            await p.locator('#u369-menu').click();await p.locator('[data-page="product"]').click();await p.locator('[name="title"][form="product-form"]').fill('Test proizvod');await p.locator('[name="price"][form="product-form"]').fill('100');await p.locator('[name="sizes"][form="product-form"]').fill('36,38');await p.locator('#product-review').click();if(!(await p.locator('#product-preview').evaluate(e=>e.classList.contains('open'))))throw Error('product review regression');
            if(errors.length)throw Error('page errors: '+errors.join(' | '));await b.close();console.log('external connections Core isolation passed');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS