name: Bootstrap Unit369 owner secret

on:
  push:
    branches:
      - ops/unit369-owner-secret-20260825

permissions:
  contents: read

concurrency:
  group: unit369-owner-secret-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 43d065736d2b5a0ecc8999e8b86ec68e
      OWNER_PUBLIC_KEY: |
        -----BEGIN PUBLIC KEY-----
        MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEA7frLCvP/PYuBE/dHrtzQ
        yJAv6RxXpP7foWWFBOOKdiw0AmpKAJLWtcDCRSS0UOTpTDHLWF9IgOJ9Jf+ih2oE
        7HPzWyLwQldUTOqBoIwRWRQi0sny+Jm1rO+Png5PGmZ1GDMn60ZTVcz9slP78L1F
        KUQ28iaRzqflx4ptBKa4brBRPhG2BjUcjxjDlZ1mgfe5CQXP/DdtppKyU6ER05Gn
        HB0IrTtVapdPLOWJR7uSp9pFQXRGZ956Rr7fPT/iYfheDh+xTTk1fKJ4cH4dbQWN
        SG4PxDYYJhBZcJf50NHsd+KrHGO7h3Cm4p7XJNMJeuAr83ZEl3X/toNzyFRvF2tM
        dSWPY+VcutM5pbvinweji0V8YY4dKDP+XBquPVxxvt4AWhgquo37Urn4jn8L7Svy
        DMqOwQ2d6zlNf5UKkPOIHmDEnetWG9mht5T/V0PIr8ERNynxU3LYAJvYkeAPTJnW
        CoSNyfiyhq1Bj6CnnOcV2HUIPXw0pwRph2QKyF8ZxYEXAgMBAAE=
        -----END PUBLIC KEY-----
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Generate, encrypt and install owner secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          normalized_token="$(
            RAW_CF_TOKEN="$CLOUDFLARE_API_TOKEN" node <<'JS'
          let token=String(process.env.RAW_CF_TOKEN||'').replace(/[\r\n]/g,'').trim();
          for(let i=0;i<4;i++){
            const before=token;
            if((token.startsWith('"')&&token.endsWith('"'))||(token.startsWith("'")&&token.endsWith("'"))) token=token.slice(1,-1).trim();
            token=token.replace(/^CLOUDFLARE_API_TOKEN\s*=\s*/i,'').trim();
            token=token.replace(/^Authorization\s*:\s*Bearer\s+/i,'').trim();
            token=token.replace(/^Bearer\s+/i,'').trim();
            if(token===before)break;
          }
          if(!token)throw Error('Cloudflare API token is empty after normalization');
          if(/\s/.test(token))throw Error('Cloudflare API token contains whitespace after normalization');
          process.stdout.write(token);
          JS
          )"
          echo "::add-mask::$normalized_token"
          export CLOUDFLARE_API_TOKEN="$normalized_token"
          printf '%s\n' "$OWNER_PUBLIC_KEY" > /tmp/unit369-owner-public.pem
          owner_code="U369-$(openssl rand -hex 20)"
          echo "::add-mask::$owner_code"
          encrypted_code="$(printf '%s' "$owner_code" | openssl pkeyutl -encrypt -pubin -inkey /tmp/unit369-owner-public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 | base64 -w0)"
          printf '%s' "$owner_code" | ./node_modules/.bin/wrangler secret put UNIT369_OWNER_ACCESS_CODE --name unit
          ./node_modules/.bin/wrangler secret list --name unit | grep -q 'UNIT369_OWNER_ACCESS_CODE'
          base='https://unit.laxmiitalianelegance.workers.dev'
          login_ok=false
          for attempt in 1 2 3 4; do
            login_status="$(curl -sS -c /tmp/unit369-owner-cookie -o /tmp/unit369-owner-login.json -w '%{http_code}' -H 'content-type: application/json' --data "{\"access_code\":\"$owner_code\"}" "$base/api/auth/owner/login" || true)"
            if [ "$login_status" = '200' ] && node <<'JS'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('/tmp/unit369-owner-login.json','utf8'));
          process.exit(data.authenticated===true&&data.user?.provider==='owner'?0:1);
          JS
            then
              login_ok=true
              break
            fi
            sleep 3
          done
          if [ "$login_ok" != 'true' ]; then
            echo "Owner login verification failed with HTTP $login_status"
            cat /tmp/unit369-owner-login.json 2>/dev/null || true
            exit 1
          fi
          curl -fsS -b /tmp/unit369-owner-cookie "$base/api/auth/me" -o /tmp/unit369-owner-me.json
          node <<'JS'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('/tmp/unit369-owner-me.json','utf8'));
          if(data.authenticated!==true||data.user?.provider!=='owner')throw Error('Owner session verification failed');
          console.log('Unit369 owner login and signed session verified.');
          JS
          echo "OWNER_CODE_RSA_B64=$encrypted_code"
