name: Validate Unit369 release hardening
on:
  push:
    branches: [staging-release-hardening]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Build
        run: |
          set -e
          node --check src/accounts.js
          node --check src/native-store.js
          node --check src/native-execution.js
          npx --yes wrangler@4 deploy --dry-run --outdir .wrangler-dist
      - name: Session authorization isolation and input limits
        run: |
          set -e
          sed 's/compatibility_date = "2026-08-19"/compatibility_date = "2026-05-03"/' wrangler.toml > wrangler.smoke.toml
          npx --yes wrangler@4 dev --config wrangler.smoke.toml --local --ip 127.0.0.1 --port 8787 --var APP_SECRET:test-app-secret-369 --var ENCRYPTION_KEY:0123456789abcdef0123456789abcdef >/tmp/wrangler.log 2>&1 &
          WPID=$!; trap 'kill $WPID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ >/dev/null && break; sleep 1; done
          node <<'JS'
          const crypto=require('crypto'),base='http://127.0.0.1:8787';
          function b64(s){return Buffer.from(s).toString('base64url')}
          function cookie(uid,exp=Date.now()+3600000){const p=b64(JSON.stringify({uid,email:uid+'@test.local',name:uid,exp}));return `u369_account=${p}.${crypto.createHmac('sha256','test-app-secret-369').update(p).digest('base64url')}`}
          async function call(path,{uid='A',cookieHeader,method='GET',body,headers={}}={}){const r=await fetch(base+path,{method,headers:{...(cookieHeader===null?{}:{cookie:cookieHeader||cookie(uid)}),...(body!==undefined?{'content-type':'application/json'}:{}),...headers},body}),t=await r.text();let d;try{d=JSON.parse(t)}catch{d=t}return{r,d}}
          (async()=>{
            let x=await call('/api/native/documents',{cookieHeader:null});if(x.r.status!==401)throw Error('anonymous native access '+x.r.status);
            const good=cookie('A'),bad=good.slice(0,-1)+(good.endsWith('x')?'y':'x');x=await call('/api/auth/me',{cookieHeader:bad});if(x.d.authenticated!==false)throw Error('tampered session accepted');
            x=await call('/api/auth/me',{cookieHeader:cookie('A',Date.now()-1000)});if(x.d.authenticated!==false)throw Error('expired session accepted');
            const made=await call('/api/native/documents',{method:'POST',body:JSON.stringify({title:'Private A',content:'secret-A'})});if(!made.r.ok||!made.d.document?.id)throw Error('seed document failed');
            const id=made.d.document.id;x=await call('/api/native/documents/'+id,{uid:'B'});if(x.r.status!==404)throw Error('foreign document id visible '+x.r.status);
            x=await call('/api/native/documents/'+id,{method:'PATCH',body:'{}'});if(x.r.status!==405)throw Error('unsupported method not blocked '+x.r.status);
            const hugeDoc='D'.repeat(400000);x=await call('/api/native/documents',{method:'POST',body:JSON.stringify({title:'Too large',content:hugeDoc})});if(x.r.status!==413)throw Error('oversized document accepted '+x.r.status);
            const hugeFile='F'.repeat(6000000);x=await call('/api/native/files',{method:'POST',body:JSON.stringify({name:'too-large.txt',content:hugeFile,mime:'text/plain'})});if(x.r.status!==413)throw Error('oversized file accepted '+x.r.status);
            x=await call('/api/native/execute',{method:'POST',body:JSON.stringify({message:'x'.repeat(20000)})});if(x.r.status>=500)throw Error('oversized execution crashed '+x.r.status);
            const bdocs=(await call('/api/native/documents',{uid:'B'})).d.documents||[];if(bdocs.some(d=>d.id===id))throw Error('cross-user list leak');
            console.log('Unit369 release hardening passed');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS