name: Validate Unit369 native communicate
on:
  push:
    branches: [staging-native-communicate]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Syntax and build
        run: |
          set -e
          node --check src/native-communicate.js
          node --check src/native-capabilities.js
          npx --yes wrangler@4 deploy --dry-run --outdir .wrangler-dist
      - name: Threads messages notifications isolation
        run: |
          set -e
          sed 's/compatibility_date = "2026-08-19"/compatibility_date = "2026-05-03"/' wrangler.toml > wrangler.smoke.toml
          npx --yes wrangler@4 dev --config wrangler.smoke.toml --local --ip 127.0.0.1 --port 8787 --var APP_SECRET:test-app-secret-369 --var ENCRYPTION_KEY:0123456789abcdef0123456789abcdef >/tmp/wrangler.log 2>&1 &
          WPID=$!; trap 'kill $WPID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ >/dev/null && break; sleep 1; done
          node <<'JS'
          const crypto=require('crypto'),base='http://127.0.0.1:8787';
          function b64(s){return Buffer.from(s).toString('base64url')}
          function cookie(uid){const p=b64(JSON.stringify({uid,email:uid+'@test.local',name:uid,exp:Date.now()+3600000}));return `u369_account=${p}.${crypto.createHmac('sha256','test-app-secret-369').update(p).digest('base64url')}`}
          async function req(uid,path,opt={}){const r=await fetch(base+path,{...opt,headers:{'content-type':'application/json',cookie:cookie(uid),...(opt.headers||{})}}),t=await r.text();let d;try{d=JSON.parse(t)}catch{d=t}if(!r.ok)throw Error(path+' '+r.status+' '+JSON.stringify(d));return d}
          (async()=>{
            if((await fetch(base+'/api/native/communicate/threads')).status!==401)throw Error('anonymous communication access');
            const th=await req('A','/api/native/communicate/threads',{method:'POST',body:JSON.stringify({title:'Launch'})});if(!th.thread?.id)throw Error('thread create');
            const m=await req('A',`/api/native/communicate/threads/${th.thread.id}/messages`,{method:'POST',body:JSON.stringify({body:'Ship Unit369',role:'user'})});if(!m.message?.id)throw Error('message create');
            const ml=await req('A',`/api/native/communicate/threads/${th.thread.id}/messages`);if(ml.messages.length!==1)throw Error('message list');
            const n=await req('A','/api/native/communicate/notifications',{method:'POST',body:JSON.stringify({title:'Done',body:'Build passed'})});if(!n.notification?.id)throw Error('notification create');
            const unread=await req('A','/api/native/communicate/notifications?unread=1');if(unread.notifications.length!==1)throw Error('unread list');
            await req('A',`/api/native/communicate/notifications/${n.notification.id}`,{method:'PUT',body:JSON.stringify({status:'read'})});
            const unread2=await req('A','/api/native/communicate/notifications?unread=1');if(unread2.notifications.length!==0)throw Error('read update');
            const b=await req('B','/api/native/communicate/threads');if(b.threads.length!==0)throw Error('cross-user thread leak');
            const foreign=await fetch(base+`/api/native/communicate/threads/${th.thread.id}`,{headers:{cookie:cookie('B')}});if(foreign.status!==404)throw Error('foreign thread visible');
            const plan=await req('A','/api/native/plan',{method:'POST',body:JSON.stringify({message:'Napravi razgovor i obavestenje'})});if(plan.external_required!==false||!plan.steps.some(s=>s.capability==='communicate'))throw Error('native communicate planning');
            console.log('Unit369 native Communicate passed');
          })().catch(e=>{console.error(e);process.exit(1)})
          JS