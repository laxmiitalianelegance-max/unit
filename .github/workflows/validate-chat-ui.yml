name: Validate Unit369 chat UI staging

on:
  push:
    branches: [staging-chat-ui]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check active JavaScript syntax
        run: |
          set -e
          files=(
            src/worker.js
            src/router.js
            src/theme.js
            src/enhancements.js
            src/unit369.js
            src/localized.js
            src/world-safe.js
            src/ai-team-safe.js
            src/product-workflow-safe.js
            src/settings-safe.js
            src/layout-safe.js
            src/app-shell-safe.js
          )
          for f in "${files[@]}"; do node --check "$f"; done

      - name: Check generated shell client
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('src/app-shell-safe.js').read_text()
          m=re.search(r"const\s+CLIENT\s*=\s*String\.raw`([\s\S]*?)`;",text)
          if not m: raise SystemExit('CLIENT not found')
          Path('/tmp/app-shell-client.js').write_text(m.group(1))
          PY
          node --check /tmp/app-shell-client.js

      - name: Wrangler dry-run build
        run: npx --yes wrangler@4 deploy --dry-run --outdir .wrangler-dist

      - name: Runtime and Chromium smoke test
        run: |
          set -e
          sed 's/compatibility_date = "2026-08-19"/compatibility_date = "2026-05-03"/' wrangler.toml > wrangler.smoke.toml
          npx --yes wrangler@4 dev --config wrangler.smoke.toml --local --ip 127.0.0.1 --port 8787 > /tmp/wrangler.log 2>&1 &
          WPID=$!
          trap 'kill $WPID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ -o /tmp/root.html && break; sleep 1; done
          test -s /tmp/root.html
          grep -q 'u369-shell-style' /tmp/root.html
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess
          html=Path('/tmp/root.html').read_text(errors='replace')
          for i,s in enumerate(re.findall(r'<script\b[^>]*>([\s\S]*?)</script>',html,flags=re.I)):
              if not s.strip(): continue
              p=Path(f'/tmp/inline-{i}.js');p.write_text(s);subprocess.run(['node','--check',str(p)],check=True)
          PY
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
          node <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            page.setDefaultTimeout(5000);
            const errors=[]; page.on('pageerror',e=>errors.push(String(e.message||e)));
            await page.goto('http://127.0.0.1:8787/',{waitUntil:'domcontentloaded',timeout:10000});
            await page.waitForTimeout(1300);
            if(!(await page.locator('#u369-menu').isVisible())) throw new Error('Hamburger missing');
            if(!(await page.locator('#page-team .promptbox').isVisible())) throw new Error('Chat composer missing');
            if(await page.locator('#page-team .modes').isVisible()) throw new Error('Modes still visible in main chat');
            if(await page.locator('#page-team .u369-roles').isVisible()) throw new Error('Provider cards still visible above chat');
            await page.locator('#u369-menu').click();
            if(!(await page.locator('#u369-sidebar').evaluate(el=>el.classList.contains('open')))) throw new Error('Drawer failed');
            if(await page.locator('.u369-mode-btn').count()<3) throw new Error('Drawer modes missing');
            if(await page.locator('.u369-provider').count()<4) throw new Error('Drawer providers missing');
            const nav=page.locator('.u369-side-item[data-shell-page]');
            if(await nav.count()<3) throw new Error('Drawer workspace navigation incomplete');
            await nav.filter({hasText:'Products'}).click();
            if(!(await page.locator('#page-product').evaluate(el=>el.classList.contains('active')))) throw new Error('Products navigation failed');
            await page.locator('#u369-menu').click();
            await nav.filter({hasText:'Settings'}).click();
            if(!(await page.locator('#page-settings').evaluate(el=>el.classList.contains('active')))) throw new Error('Settings navigation failed');
            await page.locator('#u369-menu').click();
            await nav.filter({hasText:'Chat'}).click();
            if(!(await page.locator('#page-team').evaluate(el=>el.classList.contains('active')))) throw new Error('Chat navigation failed');
            if(errors.length) throw new Error('Browser page errors: '+errors.join(' | '));
            await browser.close();
            console.log('Chat UI smoke test passed');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
