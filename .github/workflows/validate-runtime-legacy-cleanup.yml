name: Validate Unit369 runtime legacy cleanup
on:
  push:
    branches: [staging-runtime-legacy-cleanup]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Static runtime dependency audit
        run: |
          set -e
          node --check src/unit369-core.js
          node <<'JS'
          const fs=require('fs');const s=fs.readFileSync('src/unit369-core.js','utf8');
          for(const bad of ['api.openai.com','api.anthropic.com','api.x.ai','admin/oauth/access_token','admin/api/2025-10/graphql.json','url.pathname==="/api/ai-proxy"','url.pathname==="/api/products"','url.pathname==="/api/create-product"'])if(s.includes(bad))throw Error('legacy runtime dependency remains: '+bad);
          if(!s.includes('/unit369-192.png')||!s.includes('/unit369-512.png'))throw Error('local Unit369 icons not wired');
          if(!s.includes('external_connections'))throw Error('optional external connection status missing');
          console.log('Unit369 legacy runtime static audit passed');
          JS
          npx --yes wrangler@4 deploy --dry-run --outdir .wrangler-dist
      - name: Local asset and retired route smoke test
        run: |
          set -e
          sed 's/compatibility_date = "2026-08-19"/compatibility_date = "2026-05-03"/' wrangler.toml | sed '/\[\[services\]\]/,+2d' > wrangler.cleanup.toml
          npx --yes wrangler@4 dev --config wrangler.cleanup.toml --local --ip 127.0.0.1 --port 8787 --var APP_SECRET:test-app-secret-369 --var ENCRYPTION_KEY:0123456789abcdef0123456789abcdef >/tmp/wrangler.log 2>&1 &
          WPID=$!; trap 'kill $WPID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8787/app-icon-192.jpg >/tmp/icon192
          test -s /tmp/icon192
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8787/api/ai-proxy)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/api/products)" = "404"
          echo 'Unit369 retired runtime routes and local assets passed'