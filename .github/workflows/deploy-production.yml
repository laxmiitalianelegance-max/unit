name: Deploy Unit369 production
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY to confirm production deployment
        required: true
        default: ""
  push:
    branches: [main]
    paths:
      - ".github/release/production-now"
permissions:
  contents: write
concurrency:
  group: unit369-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.confirm == 'DEPLOY') || github.event_name == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 43d065736d2b5a0ecc8999e8b86ec68e
      UNIT369_PRODUCTION_URL: https://unit.laxmiitalianelegance.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install and verify exact source
        run: |
          set -euo pipefail
          npm ci
          npm run format:check
          npm run check
          npm test
          npm run build
      - name: Discover Cloudflare account and verify production contract
        run: |
          set -euo pipefail
          echo token_check > /tmp/deploy-stage
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          normalized_token="$(
            RAW_CF_TOKEN="$CLOUDFLARE_API_TOKEN" node <<'JS'
          let token=String(process.env.RAW_CF_TOKEN||'').replace(/[\r\n]/g,'').trim();
          for(let i=0;i<4;i++){
            const before=token;
            if((token.startsWith('"')&&token.endsWith('"'))||(token.startsWith("'")&&token.endsWith("'"))) token=token.slice(1,-1).trim();
            token=token.replace(/^CLOUDFLARE_API_TOKEN\s*=\s*/i,'').trim();
            token=token.replace(/^Authorization\s*:\s*Bearer\s+/i,'').trim();
            token=token.replace(/^Bearer\s+/i,'').trim();
            if(token===before)break;
          }
          if(!token)throw Error('Cloudflare API token is empty after normalization');
          if(/\s/.test(token))throw Error('Cloudflare API token contains whitespace after normalization');
          process.stdout.write(token);
          JS
          )"
          echo "::add-mask::$normalized_token"
          export CLOUDFLARE_API_TOKEN="$normalized_token"
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$CLOUDFLARE_API_TOKEN" >> "$GITHUB_ENV"
          echo token_normalized > /tmp/deploy-stage
          echo account_config > /tmp/deploy-stage
          node <<'JS'
          const id=String(process.env.CLOUDFLARE_ACCOUNT_ID||'').trim();
          if(!/^[a-f0-9]{32}$/i.test(id))throw Error('Cloudflare account ID is missing or invalid');
          console.log('Cloudflare account configured');
          JS
          echo account_discovered > /tmp/deploy-stage
          echo config_check > /tmp/deploy-stage
          grep -q '"main": "src/unit369.js"' wrangler.jsonc
          echo r2_check > /tmp/deploy-stage
          if ! ./node_modules/.bin/wrangler r2 bucket info unit369-files >/tmp/r2-info.log 2>&1; then
            ./node_modules/.bin/wrangler r2 bucket create unit369-files
          fi
          echo dry_run > /tmp/deploy-stage
          ./node_modules/.bin/wrangler deploy --dry-run --outdir .wrangler-production-dry-run
          echo preflight_ok > /tmp/deploy-stage
      - name: Deploy exact tested commit
        run: |
          set -euo pipefail
          echo deploy_start > /tmp/deploy-stage
          if ! ./node_modules/.bin/wrangler deploy > /tmp/wrangler-deploy.log 2>&1; then
            echo deploy_failed > /tmp/deploy-stage
            RAW_CF_TOKEN="$CLOUDFLARE_API_TOKEN" node <<'JS' > /tmp/deploy-error.txt
          const fs=require('fs');
          let s=fs.readFileSync('/tmp/wrangler-deploy.log','utf8');
          const token=String(process.env.RAW_CF_TOKEN||'');
          if(token)s=s.split(token).join('[REDACTED]');
          s=s.replace(/Authorization:\s*Bearer\s+\S+/ig,'Authorization: Bearer [REDACTED]');
          s=s.replace(/[A-Za-z0-9_-]{40,}/g,m=>m.length>80?'[REDACTED_LONG_VALUE]':m);
          const lines=s.split(/\r?\n/).filter(Boolean);
          process.stdout.write(lines.slice(-60).join('\n').slice(0,6000));
          JS
            cat /tmp/deploy-error.txt
            exit 1
          fi
          cat /tmp/wrangler-deploy.log
          echo deploy_ok > /tmp/deploy-stage
      - name: Verify production health
        run: |
          set -euo pipefail
          echo health_start > /tmp/deploy-stage
          BASE="${UNIT369_PRODUCTION_URL%/}"
          for i in $(seq 1 12); do
            code=$(curl -sS -o /tmp/release-health.json -w '%{http_code}' "$BASE/api/health/release" || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 5
          done
          echo health_response > /tmp/deploy-stage
          cat /tmp/release-health.json
          node <<'JS'
          const fs=require('fs');
          const h=JSON.parse(fs.readFileSync('/tmp/release-health.json','utf8'));
          if(h.status!=='ready'||h.core_ready!==true)throw Error('Unit369 Core is not production-ready: '+JSON.stringify(h));
          const required=['assets','self','native_store','tool_store','files','app_secret','encryption_key','google_oauth','ai_configured'];
          for(const k of required)if(h.checks?.[k]!==true)throw Error('Missing production requirement: '+k);
          if(h.auth_ready!==true)throw Error('Google OAuth is not configured in production.');
          console.log('Unit369 production health passed',h.version);
          JS
          echo health_verified > /tmp/deploy-stage
      - name: Verify Google OAuth start route
        run: |
          set -euo pipefail
          echo oauth_start > /tmp/deploy-stage
          BASE="${UNIT369_PRODUCTION_URL%/}"
          headers=$(curl -sS -D - -o /dev/null "$BASE/api/auth/google/start?return_to=/" )
          echo oauth_headers > /tmp/deploy-stage
          echo "$headers" | grep -qE '^HTTP/.* 302'
          location=$(printf '%s\n' "$headers" | awk 'BEGIN{IGNORECASE=1}/^location:/{sub(/^[^:]*:[[:space:]]*/,""); sub(/\r$/,""); print; exit}')
          test -n "$location"
          node - "$location" "$BASE" <<'JS'
          const [loc,base]=process.argv.slice(2);const u=new URL(loc);const redirect=u.searchParams.get('redirect_uri');
          const expected=base.replace(/\/$/,'')+'/api/auth/google/callback';
          if(redirect!==expected)throw Error(`Google redirect mismatch: ${redirect} != ${expected}`);
          console.log('Google OAuth callback verified:',expected);
          JS
          echo oauth_verified > /tmp/deploy-stage
      - name: Verify security and PWA contract
        run: |
          set -euo pipefail
          BASE="${UNIT369_PRODUCTION_URL%/}"
          curl -fsS -D /tmp/root-headers -o /tmp/root.html "$BASE/"
          grep -qi '^content-security-policy:.*nonce-' /tmp/root-headers
          grep -qi '^x-frame-options: DENY' /tmp/root-headers
          grep -q 'data-mode="auto"' /tmp/root.html
          curl -fsS "$BASE/manifest.json" -o /tmp/manifest.json
          node <<'JS'
          const fs=require('fs');
          const manifest=JSON.parse(fs.readFileSync('/tmp/manifest.json','utf8'));
          if(!Array.isArray(manifest.icons)||manifest.icons.length!==2)throw Error('PWA icons are missing');
          for(const icon of manifest.icons)if(icon.type!=='image/png')throw Error('PWA icon is not PNG');
          JS
          curl -fsS "$BASE/app-icon-512.png" -o /tmp/icon-512.png
          node <<'JS'
          const fs=require('fs');const b=fs.readFileSync('/tmp/icon-512.png');
          if(b.length<100000||b.readUInt32BE(0)!==0x89504e47)throw Error('512px icon is invalid');
          JS
      - name: Publish deployment receipt
        if: always()
        env:
          DEPLOY_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          ORIGINAL_SHA="$GITHUB_SHA"
          STAGE=$(cat /tmp/deploy-stage 2>/dev/null || echo not_started)
          HEALTH='null'
          ERROR_TEXT=''
          if [ -s /tmp/release-health.json ]; then HEALTH=$(cat /tmp/release-health.json); fi
          if [ -s /tmp/deploy-error.txt ]; then ERROR_TEXT=$(cat /tmp/deploy-error.txt); fi
          git config user.name 'unit369-release-bot'
          git config user.email 'unit369-release-bot@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin deployment-receipts >/dev/null 2>&1; then
            git fetch origin deployment-receipts:deployment-receipts
            git switch deployment-receipts
          else
            git switch --orphan deployment-receipts
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p deployment
          node - "$ORIGINAL_SHA" "$DEPLOY_STATUS" "$STAGE" "$UNIT369_PRODUCTION_URL" "$HEALTH" "$ERROR_TEXT" <<'JS' > deployment/latest.json
          const [sha,status,stage,url,rawHealth,error]=process.argv.slice(2);
          let health=null; try{health=JSON.parse(rawHealth)}catch{}
          console.log(JSON.stringify({sha,status,stage,url,health,error:error||null,recorded_at:new Date().toISOString()},null,2));
          JS
          git add deployment/latest.json
          git commit -m "Record Unit369 production deployment $ORIGINAL_SHA" || true
          git push origin deployment-receipts
