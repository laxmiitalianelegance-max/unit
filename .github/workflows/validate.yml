name: Validate Unit369 staging

on:
  push:
    branches: [staging-safe]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check active JavaScript syntax
        run: |
          set -e
          files=(
            src/worker.js
            src/router.js
            src/theme.js
            src/enhancements.js
            src/unit369.js
            src/localized.js
            src/world-safe.js
            src/ai-team-safe.js
            src/product-workflow-safe.js
          )
          for f in "${files[@]}"; do
            test -f "$f"
            echo "Checking $f"
            node --check "$f"
          done
