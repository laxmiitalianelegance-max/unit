name: Validate Unit369 staging

on:
  push:
    branches: [staging-safe]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          set -e
          for f in src/*.js; do
            echo "Checking $f"
            node --check "$f"
          done
