name: Validate Unit369 external execution cleanup
on:
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Static native-brain contract
        run: |
          set -e
          node --check src/orchestrator.js
          ! grep -q 'ANTHROPIC_API_KEY' src/orchestrator.js
          ! grep -q 'claudeTools' src/orchestrator.js
          ! grep -q 'async function agent' src/orchestrator.js
          grep -q "brain:'unit369-native'" src/orchestrator.js
          grep -q "external_role:'execution-adapter'" src/orchestrator.js
          grep -q "'/api/orchestrator/execute'" src/orchestrator.js
          npx --yes wrangler@4 deploy --dry-run --outdir .wrangler-dist
      - name: Runtime adapter and approval contract
        run: |
          set -e
          sed 's/compatibility_date = "2026-08-19"/compatibility_date = "2026-05-03"/' wrangler.toml > wrangler.smoke.toml
          npx --yes wrangler@4 dev --config wrangler.smoke.toml --local --ip 127.0.0.1 --port 8787 --var APP_SECRET:test-app-secret-369 --var ENCRYPTION_KEY:0123456789abcdef0123456789abcdef >/tmp/wrangler.log 2>&1 &
          WPID=$!; trap 'kill $WPID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/api/orchestrator/health -o /tmp/health.json && break; sleep 1; done
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/health.json')); assert x['brain']=='unit369-native'; assert x['external_role']=='execution-adapter'
          PY
          node <<'JS' >/tmp/cookie.txt
          const crypto=require('crypto');const p={uid:'adapter-test',email:'a@test.local',name:'Adapter',exp:Date.now()+3600000};const body=Buffer.from(JSON.stringify(p)).toString('base64url');const sig=crypto.createHmac('sha256','test-app-secret-369').update(body).digest('base64url');process.stdout.write('u369_account='+body+'.'+sig)
          JS
          COOKIE=$(cat /tmp/cookie.txt)
          curl -fsS -H "Cookie: $COOKIE" -H 'content-type: application/json' -d '{"toolId":"cloudflare","auth":{"api_key":"adapter-secret"}}' http://127.0.0.1:8787/api/orchestrator/connect -o /tmp/connect.json
          code=$(curl -sS -o /tmp/approval.json -w '%{http_code}' -H "Cookie: $COOKIE" -H 'content-type: application/json' -d '{"tool_id":"cloudflare","method":"POST","path":"/accounts/test","body":{"x":1}}' http://127.0.0.1:8787/api/orchestrator/execute)
          test "$code" = "200"
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/approval.json')); assert x['approval_required'] is True; assert x['external'] is True; assert x['action']['tool_id']=='cloudflare'
          PY
          code=$(curl -sS -o /tmp/retired.json -w '%{http_code}' -H "Cookie: $COOKIE" -H 'content-type: application/json' -d '{"message":"use github"}' http://127.0.0.1:8787/api/orchestrator/chat)
          test "$code" = "410"
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/retired.json')); assert x['brain']=='unit369-native'; assert x['external_execute']=='/api/orchestrator/execute'
          PY
          echo 'External execution is adapter-only and native brain is authoritative'