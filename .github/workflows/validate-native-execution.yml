name: Validate Unit369 native execution
on:
  push:
    branches: [staging-native-execution]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Syntax and build
        run: |
          set -e
          node --check src/native-execution.js
          node --check src/native-capabilities.js
          npx --yes wrangler@4 deploy --dry-run --outdir .wrangler-dist
      - name: Multi capability execution and isolation
        run: |
          set -e
          sed 's/compatibility_date = "2026-08-19"/compatibility_date = "2026-05-03"/' wrangler.toml | sed '/\[\[services\]\]/,+2d' > wrangler.smoke.toml
          npx --yes wrangler@4 dev --config wrangler.smoke.toml --local --ip 127.0.0.1 --port 8787 --var APP_SECRET:test-app-secret-369 --var ENCRYPTION_KEY:0123456789abcdef0123456789abcdef >/tmp/wrangler.log 2>&1 &
          WPID=$!; trap 'kill $WPID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ >/dev/null && break; sleep 1; done
          node <<'JS'
          const crypto=require('crypto'),base='http://127.0.0.1:8787';function b64(s){return Buffer.from(s).toString('base64url')}function cookie(uid){const p=b64(JSON.stringify({uid,email:uid+'@test.local',name:uid,exp:Date.now()+3600000}));return `u369_account=${p}.${crypto.createHmac('sha256','test-app-secret-369').update(p).digest('base64url')}`}async function req(uid,path,opt={}){const r=await fetch(base+path,{...opt,headers:{'content-type':'application/json',cookie:cookie(uid),...(opt.headers||{})}}),t=await r.text();let d;try{d=JSON.parse(t)}catch{d=t}if(!r.ok)throw Error(path+' '+r.status+' '+JSON.stringify(d));return d}
          (async()=>{const plan=await req('A','/api/native/plan',{method:'POST',body:JSON.stringify({message:'Napravi dokument, projekat, dizajn, proizvod i poruku'})});for(const c of ['create','work','business','communicate'])if(!plan.steps.some(s=>s.capability===c))throw Error('planner missing '+c);if(plan.external_required!==false)throw Error('external dependency');console.log('Unit369 execution planner contract passed')})().catch(e=>{console.error(e);process.exit(1)})
          JS