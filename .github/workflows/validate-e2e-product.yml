name: Validate Unit369 end to end product
on:
  push:
    branches: [staging-e2e-product-audit]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Build
        run: |
          set -e
          node --check src/unit369.js
          node --check src/native-capabilities.js
          node --check src/native-execution.js
          node --check src/orchestrator.js
          npx --yes wrangler@4 deploy --dry-run --outdir .wrangler-dist
      - name: Real user flow API and mobile audit
        run: |
          set -e
          sed 's/compatibility_date = "2026-08-19"/compatibility_date = "2026-05-03"/' wrangler.toml > wrangler.smoke.toml
          npx --yes wrangler@4 dev --config wrangler.smoke.toml --local --ip 127.0.0.1 --port 8787 --var APP_SECRET:test-app-secret-369 --var ENCRYPTION_KEY:0123456789abcdef0123456789abcdef >/tmp/wrangler.log 2>&1 &
          WPID=$!; trap 'kill $WPID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ >/dev/null && break; sleep 1; done
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
          node <<'JS'
          const crypto=require('crypto'),base='http://127.0.0.1:8787';
          function b64(s){return Buffer.from(s).toString('base64url')}
          function cookie(uid){const p=b64(JSON.stringify({uid,email:uid+'@test.local',name:uid,exp:Date.now()+3600000}));return `u369_account=${p}.${crypto.createHmac('sha256','test-app-secret-369').update(p).digest('base64url')}`}
          async function req(uid,path,opt={}){const r=await fetch(base+path,{...opt,headers:{'content-type':'application/json',cookie:cookie(uid),...(opt.headers||{})}}),t=await r.text();let d;try{d=JSON.parse(t)}catch{d=t}if(!r.ok)throw Error(path+' '+r.status+' '+JSON.stringify(d));return d}
          (async()=>{
            const msg='Napravi dokument i projekat za lansiranje Unit369 proizvoda';
            const plan=await req('A','/api/native/plan',{method:'POST',body:JSON.stringify({message:msg})});
            if(plan.external_required!==false||!plan.steps.some(s=>s.capability==='create')||!plan.steps.some(s=>s.capability==='work'))throw Error('planner contract');
            const docsBefore=await req('A','/api/native/documents');
            const projectsBefore=await req('A','/api/native/projects');
            const browser=await require('playwright').chromium.launch({headless:true});
            const ctx=await browser.newContext({viewport:{width:390,height:844},serviceWorkers:'allow'});const p=await ctx.newPage();const errors=[];p.on('pageerror',e=>errors.push(String(e.message||e)));
            await ctx.addCookies([{name:'u369_account',value:cookie('A').split('=')[1],domain:'127.0.0.1',path:'/'}]);
            await p.route('**/api/free-ai',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({content:'Završeno na osnovu native izvršenja.'})}));
            await p.goto(base+'/',{waitUntil:'domcontentloaded'});await p.waitForTimeout(600);
            if(await p.locator('#u369-chat-input').count()!==1)throw Error('chat composer');
            await p.locator('#u369-chat-input').fill(msg);await p.locator('#u369-chat-send').click();
            await p.locator('.u369-answer').filter({hasText:'Završeno'}).waitFor();
            const docsAfter=await req('A','/api/native/documents');const projectsAfter=await req('A','/api/native/projects');
            if((docsAfter.documents||[]).length<=(docsBefore.documents||[]).length)throw Error('chat did not create document');
            if((projectsAfter.projects||[]).length<=(projectsBefore.projects||[]).length)throw Error('chat did not create project');
            await p.locator('#u369-menu').click();await p.locator('[data-page="product"]').click();if(!(await p.locator('#page-product').evaluate(e=>e.classList.contains('active'))))throw Error('product page');
            await p.locator('#u369-menu').click();await p.locator('[data-page="settings"]').click();if(!(await p.locator('#page-settings').evaluate(e=>e.classList.contains('active'))))throw Error('settings page');
            if(await p.locator('[data-page="tools"]:visible').count()!==0)throw Error('legacy toolkit visible');
            const sw=await p.evaluate(async()=>({supported:'serviceWorker' in navigator,controller:!!navigator.serviceWorker?.controller,regs:'serviceWorker' in navigator?(await navigator.serviceWorker.getRegistrations()).length:0}));
            console.log('PWA_STATE '+JSON.stringify(sw));
            if(errors.length)throw Error('page errors '+errors.join(' | '));
            await browser.close();
            const other=await req('B','/api/native/documents');if((other.documents||[]).length)throw Error('cross-user document leak');
            console.log('Unit369 E2E online flow passed');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS