name: Validate Unit369 shell staging

on:
  push:
    branches: [staging-shell]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check active JavaScript syntax
        run: |
          set -e
          files=(src/worker.js src/router.js src/theme.js src/enhancements.js src/unit369.js src/localized.js src/world-safe.js src/ai-team-safe.js src/product-workflow-safe.js src/settings-safe.js src/layout-safe.js src/app-shell-safe.js)
          for f in "${files[@]}"; do test -f "$f"; node --check "$f"; done

      - name: Check generated browser clients
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          targets=[('src/ai-team-safe.js','CLIENT'),('src/product-workflow-safe.js','CLIENT'),('src/settings-safe.js','CLIENT'),('src/layout-safe.js','CLIENT'),('src/app-shell-safe.js','CLIENT')]
          for path,name in targets:
              text=Path(path).read_text(); m=re.search(rf"const\s+{name}\s*=\s*String\.raw`([\s\S]*?)`;",text)
              if not m: raise SystemExit(f'Could not extract {name} from {path}')
              (Path('/tmp')/(Path(path).stem+'-client.js')).write_text(m.group(1))
          PY
          node --check /tmp/ai-team-safe-client.js
          node --check /tmp/product-workflow-safe-client.js
          node --check /tmp/settings-safe-client.js
          node --check /tmp/layout-safe-client.js
          node --check /tmp/app-shell-safe-client.js

      - name: Wrangler dry-run build
        run: npx --yes wrangler@4 deploy --dry-run --outdir .wrangler-dist

      - name: Runtime and browser smoke test
        run: |
          set -e
          sed 's/compatibility_date = "2026-08-19"/compatibility_date = "2026-05-03"/' wrangler.toml > wrangler.smoke.toml
          npx --yes wrangler@4 dev --config wrangler.smoke.toml --local --ip 127.0.0.1 --port 8787 > /tmp/wrangler.log 2>&1 &
          WPID=$!
          trap 'kill $WPID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ -o /tmp/root.html && break; sleep 1; done
          test -s /tmp/root.html
          grep -q 'u369-shell-style' /tmp/root.html
          grep -q 'u369-layout-safe-style' /tmp/root.html
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess
          html=Path('/tmp/root.html').read_text(errors='replace')
          for i,script in enumerate(re.findall(r'<script\b[^>]*>([\s\S]*?)</script>',html,flags=re.I)):
              if script.strip():
                  p=Path(f'/tmp/inline-{i}.js'); p.write_text(script); subprocess.run(['node','--check',str(p)],check=True)
          PY
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
          node <<'JS'
          const { chromium }=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            page.setDefaultTimeout(5000);
            const errors=[]; page.on('pageerror',e=>errors.push(String(e.message||e)));
            console.log('STEP open');
            await page.goto('http://127.0.0.1:8787/',{waitUntil:'domcontentloaded',timeout:10000});
            await page.waitForTimeout(1400);
            console.log('STEP shell');
            if(!(await page.locator('#u369-shell-marker').count())) throw new Error('Shell marker missing');
            if(!(await page.locator('#u369-sidebar').count())) throw new Error('Sidebar missing');
            if(!(await page.locator('#u369-topbar').count())) throw new Error('Topbar missing');
            if(await page.locator('nav.bottomnav').isVisible()) throw new Error('Legacy bottom nav still visible');
            const menu=page.locator('#u369-menu'); if(!(await menu.isVisible())) throw new Error('Mobile menu missing');
            console.log('STEP drawer');
            await menu.click();
            if(!(await page.locator('#u369-sidebar').evaluate(el=>el.classList.contains('open')))) throw new Error('Drawer did not open');
            const items=page.locator('.u369-side-item[data-shell-page]'); if(await items.count()<3) throw new Error('Shell navigation incomplete');
            console.log('STEP products');
            await items.filter({hasText:'Products'}).click();
            if(!(await page.locator('#page-product').evaluate(el=>el.classList.contains('active')))) throw new Error('Products shell navigation failed');
            console.log('STEP settings');
            await menu.click(); await items.filter({hasText:'Settings'}).click();
            if(!(await page.locator('#page-settings').evaluate(el=>el.classList.contains('active')))) throw new Error('Settings shell navigation failed');
            console.log('STEP team');
            await menu.click(); await items.filter({hasText:'AI Team'}).click();
            if(!(await page.locator('#page-team').evaluate(el=>el.classList.contains('active')))) throw new Error('AI Team shell navigation failed');
            if(!(await page.locator('#page-team .promptbox').count())) throw new Error('AI composer missing');
            console.log('STEP locale');
            const lang=page.locator('#u369-lang-all-s');
            if(await lang.count()){
              await menu.click(); await items.filter({hasText:'Settings'}).click();
              await lang.selectOption('ar'); await page.waitForTimeout(500);
              if(await page.evaluate(()=>document.documentElement.dir)!=='rtl') throw new Error('RTL failed in shell');
              await lang.selectOption('en'); await page.waitForTimeout(300);
              if(await page.evaluate(()=>document.documentElement.dir)!=='ltr') throw new Error('LTR failed in shell');
            }
            if(errors.length) throw new Error('Browser page errors: '+errors.join(' | '));
            console.log('STEP close');
            await browser.close(); console.log('Shell browser smoke test passed');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
